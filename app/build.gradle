plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.zjfgh.zhujibus'
    compileSdk 35

    defaultConfig {
        applicationId "org.zjfgh.zhujibus"
        minSdk 24
        targetSdk 35
        versionCode 102046
        versionName "1.2.46"
        //wsServerAddress = `http://zhujibus.360967.xyz/ws`
        //githubAddSpeed = `https://gh-proxy.org`
        //remote={"has_notice":true,"notice":"1.2.46版本开始支持查询全国地区公交，数据来源为高德地图，可能存准确性较低的问题，仅供娱乐。（非诸暨地区因高德限制仅支持GPS模式），提供模拟GPS报站，自定义报站格式，自定义语音包路径格式等功能，语音包不存在时，将调用系统TTS朗读。目前发现诸暨城市公交票价信息和距离信息缺失，该问题为诸暨交通运输局平台的问题，可能导致排班中的到达时间计算错误。教程请在B站搜索用户：\"oho19950813\"。，网络模式下选择一个站点后，即可开始播报最近车辆，GPS导航模式下，需要前往当地乘坐对应公交，或者使用内置模拟定位方可体验。感谢您的使用，诸暨查询接口版权归诸暨市交通局所有，其他地区归高德地图所有。","has_update":true,"update_log":"1.实现全国公交查询，需联网（数据来自高德地图）\n2.非诸暨地区：仅支持GPS模式（高德限制）\n3.诸暨地区：站点坐标允许通过匹配并使用高德站点坐标（用于修正官方接口坐标偏差）功能入口：数知梦车机UI，多功能按钮内\n4.添加GPS模拟报站功能\n5.增加 自定义语音包功能\n6.新增 自定义语音报站格式\n7.新增 自定义滚动LED格式\n8.拍POV同步支持 GPS模拟位置\n9.优化UI，修复其他Bug"}
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('KEY_STORE_FILE'))
            storePassword project.findProperty('KEY_STORE_PASSWORD')
            keyAlias project.findProperty('KEY_ALIAS')
            keyPassword project.findProperty('KEY_PASSWORD')
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def versionName = variant.outputs[0].versionName.get()
        def versionCode = variant.outputs[0].versionCode.get()
        variant.outputs.each { output ->
            def buildType = variant.buildType
            def suffix = buildType == "release" ? "release" : "debug"
            output.outputFileName.set("zhujibus-${versionCode}-${suffix}.apk")
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // 网络请求和 JSON 处理依赖
    implementation libs.okhttp       // OkHttp
    implementation libs.jackson.databind // Jackson
    implementation libs.kotlinx.coroutines.android
    // 导航 3D 地图包
    implementation libs.amapNavi3dmap
    // 高德搜索 SDK（地区/公交检索，含 Inputtips、BusLineSearch 等）
    implementation libs.amapSearch
    implementation libs.glide
    implementation libs.gridlayout
    implementation libs.sdp
    implementation libs.ssp
    // CameraX 替代 Camera2，简化生命周期与兼容性
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    // 站名拼音回退（en 字段缺失时显示拼音，每个音节首字母大写）
    implementation libs.pinyin4j
}
